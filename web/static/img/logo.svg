<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gradiente dorado para la brújula / estrella de orientación -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C68F"/>
      <stop offset="50%" stop-color="#D49A3D"/>
      <stop offset="100%" stop-color="#B87322"/>
    </linearGradient>

    <!-- Gradiente verde campo profundo para la cornamenta y estructura -->
    <linearGradient id="pampaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A43"/>
      <stop offset="100%" stop-color="#143224"/>
    </linearGradient>

    <!-- Sombra sutil para profundidad -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ISOLOGO / SÍMBOLO (X: 20 to 140, Y: 15 to 145) -->
  <g transform="translate(15, 10)" filter="url(#subtleGlow)">
    <!-- Base / Escudo estilizado circular sutil -->
    <circle cx="70" cy="70" r="65" fill="#FAF8F5" stroke="#E5DFD5" stroke-width="2"/>
    <circle cx="70" cy="70" r="59" fill="none" stroke="#D49A3D" stroke-width="1" stroke-dasharray="3, 4" opacity="0.6"/>

    <!-- Cornamenta del Toro (Símbolo de fuerza y ganadería) -->
    <!-- Cuerno Izquierdo -->
    <path d="M 70 72 C 60 55 42 42 28 46 C 24 47 23 51 26 53 C 38 60 52 70 62 88 Z" fill="url(#pampaGreen)"/>
    <!-- Cuerno Derecho -->
    <path d="M 70 72 C 80 55 98 42 112 46 C 116 47 117 51 114 53 C 102 60 88 70 78 88 Z" fill="url(#pampaGreen)"/>

    <!-- Silueta Facial Geométrica / Cabeza del Bovino -->
    <path d="M 48 68 L 92 68 L 84 98 L 70 114 L 56 98 Z" fill="url(#pampaGreen)"/>
    <!-- Detalle de testera frontal en ángulo -->
    <path d="M 52 72 L 88 72 L 81 96 L 70 108 L 59 96 Z" fill="#1B3F2E"/>

    <!-- Estrella del Norte / Brújula del Baqueano (Guía y Navegación) -->
    <!-- Aguja Norte (Alzada hacia arriba = Crecimiento y orientación) -->
    <path d="M 70 20 L 76 54 L 70 48 Z" fill="url(#goldGrad)"/>
    <path d="M 70 20 L 64 54 L 70 48 Z" fill="#B87322"/>
    
    <!-- Aguja Sur -->
    <path d="M 70 76 L 75 56 L 70 60 Z" fill="url(#goldGrad)"/>
    <path d="M 70 76 L 65 56 L 70 60 Z" fill="#B87322"/>

    <!-- Aguja Este -->
    <path d="M 98 54 L 76 49 L 80 54 Z" fill="url(#goldGrad)"/>
    <path d="M 98 54 L 76 59 L 80 54 Z" fill="#B87322"/>

    <!-- Aguja Oeste -->
    <path d="M 42 54 L 64 49 L 60 54 Z" fill="url(#goldGrad)"/>
    <path d="M 42 54 L 64 59 L 60 54 Z" fill="#B87322"/>

    <!-- Núcleo central de la brújula -->
    <circle cx="70" cy="54" r="3.5" fill="#FAF8F5" stroke="#D49A3D" stroke-width="1.5"/>
  </g>

  <!-- TIPOGRAFÍA / WORDMARK -->
  <g transform="translate(180, 0)">
    <!-- Título Principal: BAQUEANO -->
    <text x="0" y="86" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="7" 
          fill="#143224">
      BAQUEANO
    </text>

    <!-- Línea divisoria decorativa con acento en rombo -->
    <line x1="2" y1="104" x2="360" y2="104" stroke="#D49A3D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="104" r="3.5" fill="#D49A3D"/>

    <!-- Bajada / Propuesta de Valor -->
    <text x="3" y="128" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#6C757D">
      INTELIGENCIA GANADERA &amp; COTIZACIÓN
    </text>
  </g>
</svg>

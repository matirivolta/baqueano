<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0A3"/>
      <stop offset="50%" stop-color="#E5A93B"/>
      <stop offset="100%" stop-color="#C27D1B"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E936B"/>
      <stop offset="100%" stop-color="#235A3E"/>
    </linearGradient>

    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E5A93B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ISOLOGO / SÍMBOLO -->
  <g transform="translate(15, 10)">
    <circle cx="70" cy="70" r="65" fill="#131F18" stroke="#254333" stroke-width="2"/>
    <circle cx="70" cy="70" r="59" fill="none" stroke="#E5A93B" stroke-width="1" stroke-dasharray="3, 4" opacity="0.4"/>

    <!-- Cornamenta -->
    <path d="M 70 72 C 60 55 42 42 28 46 C 24 47 23 51 26 53 C 38 60 52 70 62 88 Z" fill="url(#emeraldGrad)"/>
    <path d="M 70 72 C 80 55 98 42 112 46 C 116 47 117 51 114 53 C 102 60 88 70 78 88 Z" fill="url(#emeraldGrad)"/>

    <!-- Cabeza -->
    <path d="M 48 68 L 92 68 L 84 98 L 70 114 L 56 98 Z" fill="url(#emeraldGrad)"/>
    <path d="M 52 72 L 88 72 L 81 96 L 70 108 L 59 96 Z" fill="#183B28"/>

    <!-- Brújula / Rosa de los vientos -->
    <g filter="url(#glowDark)">
      <path d="M 70 20 L 76 54 L 70 48 Z" fill="url(#goldGradDark)"/>
      <path d="M 70 20 L 64 54 L 70 48 Z" fill="#A86812"/>
      <path d="M 70 76 L 75 56 L 70 60 Z" fill="url(#goldGradDark)"/>
      <path d="M 70 76 L 65 56 L 70 60 Z" fill="#A86812"/>
      <path d="M 98 54 L 76 49 L 80 54 Z" fill="url(#goldGradDark)"/>
      <path d="M 98 54 L 76 59 L 80 54 Z" fill="#A86812"/>
      <path d="M 42 54 L 64 49 L 60 54 Z" fill="url(#goldGradDark)"/>
      <path d="M 42 54 L 64 59 L 60 54 Z" fill="#A86812"/>
      <circle cx="70" cy="54" r="3.5" fill="#131F18" stroke="#E5A93B" stroke-width="1.5"/>
    </g>
  </g>

  <!-- TIPOGRAFÍA -->
  <g transform="translate(180, 0)">
    <text x="0" y="86" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="7" 
          fill="#F4EFE6">
      BAQUEANO
    </text>

    <line x1="2" y1="104" x2="360" y2="104" stroke="#E5A93B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="104" r="3.5" fill="#E5A93B"/>

    <text x="3" y="128" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#A3B899">
      INTELIGENCIA GANADERA &amp; COTIZACIÓN
    </text>
  </g>
</svg>
